site_name: AMX
site_description: Agentic Metadata Extractor — AI-powered CLI to infer and manage database metadata.
site_url: https://amxcli.com/
site_author: Omer Yasir Kucuk
copyright: Copyright &copy; 2026 Omer Yasir Kucuk — Apache-2.0

repo_url: https://github.com/omeryasirkucuk/amx
repo_name: omeryasirkucuk/amx
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/amx-logo.png
  favicon: assets/favicon.png
  features:
    # navigation.instant intercepts in-page anchor clicks and runs its
    # own window.scrollTo, which bypasses CSS scroll-margin/padding —
    # the cause of the "click X, get section above X" bug. Disabled.
    # Cross-page nav reverts to plain reloads (~50ms slower, no SPA feel)
    # but in-page anchor jumps now use the browser's native scroll which
    # honors scroll-padding-top.
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    # search.share intentionally disabled — adds a share-link icon
    # next to the close button in the modal that we don't need.
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  # Single dark palette — no toggle. Material renders the theme toggle
  # only when palette is a list (multiple schemes). With a single mapping
  # like this, the site is locked to dark and the sun/moon button isn't
  # emitted into the header at all.
  palette:
    scheme: slate
    primary: orange
    accent: orange
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/omeryasirkucuk/amx
      name: AMX on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/amx/
      name: AMX on PyPI
  generator: false
  # Single source of truth for the version shown on the site.
  # Bump this string for each release; the footer reads it via
  # {{ config.extra.version }}. Sample REPL/doctor outputs that quote
  # a specific version stay hardcoded — they're frozen examples.
  version: "0.12.8"

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
