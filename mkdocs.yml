site_name: AMX
site_description: Agentic Metadata Extractor — AI-powered CLI to infer and manage database metadata.
site_url: https://omeryasirkucuk.github.io/amx/
site_author: Omer Yasir Kucuk
copyright: Copyright &copy; 2026 Omer Yasir Kucuk — Apache-2.0

repo_url: https://github.com/omeryasirkucuk/amx
repo_name: omeryasirkucuk/amx
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - announce.dismiss
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/omeryasirkucuk/amx
      name: AMX on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/amx/
      name: AMX on PyPI
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/installation.md
      - getting-started/quickstart.md
      - getting-started/first-run.md
  - Concepts:
      - concepts/architecture.md
      - concepts/agents.md
      - concepts/universal-metadata.md
      - concepts/human-in-the-loop.md
  - CLI Reference:
      - cli/overview.md
      - cli/setup.md
      - cli/run-and-apply.md
      - cli/ask-and-search.md
      - cli/history.md
      - cli/doctor.md
      - cli/flags.md
  - Backends:
      - backends/index.md
      - PostgreSQL: backends/postgresql.md
      - Snowflake: backends/snowflake.md
      - Databricks: backends/databricks.md
      - BigQuery: backends/bigquery.md
      - MySQL: backends/mysql.md
      - Oracle: backends/oracle.md
      - SQL Server: backends/mssql.md
      - Redshift: backends/redshift.md
      - ClickHouse: backends/clickhouse.md
      - DuckDB: backends/duckdb.md
  - LLM Providers:
      - llm-providers/index.md
      - llm-providers/openai.md
      - llm-providers/anthropic.md
      - llm-providers/gemini.md
      - llm-providers/ollama-local.md
      - llm-providers/batch-mode.md
  - Data Sources:
      - data-sources/codebase.md
      - data-sources/documents.md
      - data-sources/search-catalog.md
  - Collaboration:
      - collaboration/shared-history-store.md
      - collaboration/team-setup.md
      - collaboration/safety-guards.md
  - Configuration:
      - configuration/config-yml.md
      - configuration/env-vars.md
      - configuration/tls-and-proxies.md
      - configuration/profiling-modes.md
  - Python API:
      - api/index.md
      - api/reference.md
  - Guides:
      - guides/sap-discovery-walkthrough.md
      - guides/snowflake-warehouse-cost.md
      - guides/batch-large-schema.md
  - Troubleshooting:
      - troubleshooting/faq.md
      - troubleshooting/doctor.md
      - troubleshooting/common-errors.md
  - Contributing: contributing.md
  - Security: security.md
  - Changelog: changelog.md
