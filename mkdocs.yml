site_name: AMX
site_description: Agentic Metadata Extractor — AI-powered CLI to infer and manage database metadata.
site_url: https://omeryasirkucuk.github.io/amx/
site_author: Omer Yasir Kucuk
copyright: Copyright &copy; 2026 Omer Yasir Kucuk — Apache-2.0

repo_url: https://github.com/omeryasirkucuk/amx
repo_name: omeryasirkucuk/amx
edit_uri: ""

docs_dir: docs
site_dir: site

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/logo.svg
  favicon: assets/favicon.svg
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.sections
    - navigation.indexes
    - navigation.expand
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: default
      primary: blue
      accent: blue
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/omeryasirkucuk/amx
      name: AMX on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/amx/
      name: AMX on PyPI
  generator: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      title: On this page
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'

nav:
  - Home: index.md
  - Get Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - First Run Walkthrough: getting-started/first-run.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Agents: concepts/agents.md
      - Universal Metadata: concepts/universal-metadata.md
      - Human in the Loop: concepts/human-in-the-loop.md
  - CLI:
      - Overview: cli/overview.md
      - Setup: cli/setup.md
      - Run & Apply: cli/run-and-apply.md
      - Ask & Search: cli/ask-and-search.md
      - History: cli/history.md
      - Doctor: cli/doctor.md
      - Flags: cli/flags.md
  - Backends:
      - Overview: backends/index.md
      - PostgreSQL: backends/postgresql.md
      - Snowflake: backends/snowflake.md
      - Databricks: backends/databricks.md
      - BigQuery: backends/bigquery.md
      - MySQL: backends/mysql.md
      - Oracle: backends/oracle.md
      - SQL Server: backends/mssql.md
      - Redshift: backends/redshift.md
      - ClickHouse: backends/clickhouse.md
      - DuckDB: backends/duckdb.md
  - Guides:
      - SAP Discovery: guides/sap-discovery-walkthrough.md
      - Batch Large Schema: guides/batch-large-schema.md
  - Reference:
      - Configuration:
          - config.yml: configuration/config-yml.md
          - Environment variables: configuration/env-vars.md
          - TLS and proxies: configuration/tls-and-proxies.md
          - Profiling modes: configuration/profiling-modes.md
      - LLM Providers:
          - Overview: llm-providers/index.md
          - OpenAI: llm-providers/openai.md
          - Anthropic: llm-providers/anthropic.md
          - Gemini: llm-providers/gemini.md
          - Ollama and local: llm-providers/ollama-local.md
          - Batch mode: llm-providers/batch-mode.md
      - Data Sources:
          - Codebase: data-sources/codebase.md
          - Documents: data-sources/documents.md
          - Search catalog: data-sources/search-catalog.md
      - Collaboration:
          - Shared history store: collaboration/shared-history-store.md
          - Team setup: collaboration/team-setup.md
          - Safety guards: collaboration/safety-guards.md
      - Troubleshooting:
          - FAQ: troubleshooting/faq.md
          - Diagnostics: troubleshooting/doctor.md
          - Common errors: troubleshooting/common-errors.md
      - Project:
          - Python API: api/index.md
          - API Reference: api/reference.md
          - Contributing: contributing.md
          - Security: security.md
          - Changelog: changelog.md
