          - Anthropic: llm-providers/anthropic.md
          - Gemini: llm-providers/gemini.md
          - Databricks Serving: llm-providers/databricks-serving.md
          - Ollama and local: llm-providers/ollama-local.md
          - Batch mode: llm-providers/batch-mode.md
      - Data Sources:
