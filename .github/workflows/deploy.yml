name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

# GITHUB_TOKEN needs write access to push the built site to gh-pages.
permissions:
  contents: write

# Forward-compat: opt into Node.js 24 for actions that haven't published a
# Node 24 release yet (silences the Sept 2025 deprecation warning, makes
# the workflow survive past September 2026 when Node 20 is removed from
# runners). Older actions that still ship Node 20 binaries continue to run
# under Node 24 with this flag set.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history — mkdocs gh-deploy commits onto an existing branch.
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build deps
        run: pip install -r requirements.txt

      - name: Bake PyPI download count for header badge
        # pypistats.org has no CORS headers, so the browser can't fetch it
        # from amxcli.com. We fetch server-side here and write a same-origin
        # JSON file that the header JS reads. Failures fall back to 0 (the
        # badge then renders "0", which a refresh fixes — better than the
        # build silently breaking on a transient rate-limit).
        run: |
          set -eu
          mkdir -p docs/assets
          n=$(curl -fsS --max-time 10 "https://pypistats.org/api/packages/amx-cli/recent" \
                | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['data']['last_month'])" \
                || echo 0)
          printf '{"n":%s,"t":%s000}\n' "$n" "$(date +%s)" > docs/assets/pypi.json
          echo "Baked: $(cat docs/assets/pypi.json)"

      - name: Build site (strict — fails on broken links)
        run: mkdocs build --strict

      - name: Configure git for deploy
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Deploy to gh-pages on this repo
        run: |
          mkdocs gh-deploy --force --message "ci deploy ${{ github.sha }}"
